# 운영(prod) 프로파일. SPRING_PROFILES_ACTIVE=prod 일 때만 application.yml 위에 덮어쓴다.
# 비밀값(DB_PASSWORD, JWT_SECRET, GOOGLE_CLIENT_ID, ROOT_EMAIL, CORS_ALLOWED_ORIGINS)은 여기 두지 않고 환경변수로만 받는다.
spring:
  datasource:
    # 같은 Docker 네트워크 안의 DB에만 접속한다. 바깥으로 열리지 않아서 SSL은 쓰지 않는다
    url: jdbc:mysql://${DB_HOST:db}:3306/${DB_NAME:srpfreaks}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:srpfreaks}

app:
  cookie:
    # 운영은 HTTPS만 쓰므로 Secure를 고정한다. 환경변수(COOKIE_SECURE)로 끌 수 없다
    secure: true

# API 문서(Swagger)는 운영에 열지 않는다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: info
    # SQL 로그에는 파라미터(개인정보)가 섞일 수 있어 운영에서는 끈다
    org.hibernate.SQL: warn
