spring:
  datasource:
    url: jdbc:mysql://localhost:3307/srpfreaks?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: srpfreaks
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # 시간은 UTC로 저장하고 화면에서 Asia/Seoul로 변환한다

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080

jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 900000
    refresh-token-validity: 1209600000

logging:
  level:
    org.hibernate.SQL: debug
