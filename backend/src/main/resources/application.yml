spring:
  datasource:
    url: jdbc:mysql://localhost:3307/srpfreaks?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: srpfreaks
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 요청이 끝날 때까지 DB 연결을 붙잡지 않는다(기본값 true). 지연 로딩은 서비스의 @Transactional 안에서 끝내야 한다.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # 시간은 UTC로 저장하고 화면에서 Asia/Seoul로 변환한다

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080
  # 앞단 리버스 프록시(nginx)가 붙이는 X-Forwarded-For를 신뢰할 수 있는 내부 프록시에서 온 경우에만 반영한다. Rate Limit이 실제 클라이언트 IP를 보게 하기 위해서다
  forward-headers-strategy: native

# 헬스체크: health 하나만 노출하고 상세(DB 종류 등)는 숨긴다. 나머지 actuator 엔드포인트는 만들지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}               # 32바이트 이상, 환경변수로만 주입
  issuer: srpfreaks
  access-token-validity: 900000       # 15분
  refresh-token-validity: 1209600000  # 14일

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID}    # Google ID 토큰 aud 검증용
  root-email: ${ROOT_EMAIL:}          # 이 이메일의 첫 로그인 계정만 ROOT (비우면 ROOT 자동 생성 없음)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}   # 쉼표로 여러 개. * 금지
  cookie:
    secure: ${COOKIE_SECURE:true}     # 로컬 http 개발에서만 false로 내린다
  rate-limit:
    auth-per-minute: 10      # 로그인: IP당 1분 10회
    public-read-per-minute: 120   # 비로그인 공개 읽기(공지·곡·서열표·유저): IP당 1분 120회. 로그인 사용자는 제한 없음
    refresh-per-minute: 60   # 재발급·로그아웃: IP당 1분 60회 (오락실 공용 Wi-Fi처럼 한 IP를 여러 명이 쓸 수 있다)
  import-api:
    enabled: ${IMPORT_API_ENABLED:true}   # 최근 플레이 가져오기(D34) 모두에게 열기(2026-10-19). 문제가 생기면 환경변수 IMPORT_API_ENABLED=false로 ROOT 전용으로 되돌린다

logging:
  level:
    org.hibernate.SQL: debug
