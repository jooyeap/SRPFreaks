spring:
  datasource:
    url: jdbc:mysql://localhost:3307/srpfreaks?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: srpfreaks
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080

jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 900000
    refresh-token-validity: 1209600000

logging:
  level:
    org.hibernate.SQL: debug