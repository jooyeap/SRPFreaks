# 배포: GitHub Actions 화면(또는 모바일 앱)에서 "Run workflow"를 눌렀을 때만 실행한다. (푸시로는 실행되지 않는다)
# 러너가 EC2에 SSH로 접속해 지정한 브랜치를 pull하고, 선택한 서비스만 다시 빌드·재시작한다.
#
# 지켜야 할 것
# - DB(`db` 컨테이너·볼륨)는 건드리지 않는다. `down -v`를 쓰지 않는다.
# - 서버의 `.env.prod`는 읽거나 덮어쓰지 않는다. 서버에 있는 파일을 compose가 그대로 읽는다.
# - 비밀값(SSH 키, 서버 주소)은 저장소에 두지 않고 Repository secrets에서만 읽는다.
#
# 필요한 Repository secrets (Settings → Secrets and variables → Actions)
# - EC2_HOST        서버 주소(IP 또는 도메인)
# - EC2_USER        SSH 사용자 이름 (예: ubuntu)
# - EC2_SSH_KEY     SSH 개인키 전체 내용(.pem 파일 내용). 이 키만 쓰는 배포 전용 키를 권장한다
# - EC2_KNOWN_HOSTS 서버의 호스트 키 줄(로컬에서 `ssh-keyscan -t ed25519 서버주소` 결과). 중간자 공격 방지용
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "배포할 브랜치 (예: main, feature/frontend-format)"
        required: true
        default: main
      target:
        description: "다시 빌드할 서비스"
        required: true
        type: choice
        default: frontend
        options:
          - frontend
          - backend
          - frontend + backend

# 배포가 겹쳐 돌면 서버에서 빌드가 엉키므로 한 번에 하나만 돌린다 (새 요청은 기다린다)
concurrency:
  group: deploy
  cancel-in-progress: false

# 저장소를 읽기만 한다
permissions:
  contents: read

jobs:
  deploy:
    name: EC2 배포
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 입력값 확인
        env:
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.target }}
        run: |
          # 브랜치 이름에는 이 글자만 허용한다 (서버 명령에 이상한 문자가 섞이지 않게)
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "브랜치 이름에 쓸 수 없는 글자가 있습니다." >&2
            exit 1
          fi
          case "$TARGET" in
            "frontend")          echo "SERVICES=frontend" >> "$GITHUB_ENV" ;;
            "backend")           echo "SERVICES=backend" >> "$GITHUB_ENV" ;;
            "frontend + backend") echo "SERVICES=backend frontend" >> "$GITHUB_ENV" ;;
            *) echo "알 수 없는 대상입니다." >&2; exit 1 ;;
          esac

      - name: SSH 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 서버에서 pull 후 재빌드
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          REF: ${{ inputs.ref }}
        run: |
          # 서버에서 실행할 명령은 표준 입력(<<'REMOTE')으로 보낸다. 값은 인자로만 넘겨 따옴표 문제를 피한다.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" bash -s -- "$REF" "$SERVICES" <<'REMOTE'
          set -euo pipefail
          REF="$1"
          SERVICES="$2"
          cd ~/gitalog
          git fetch origin
          git checkout "$REF"
          git pull --ff-only origin "$REF"
          # 프론트 이미지에 "어느 커밋으로 빌드했는지"를 넣는다(푸터·/version). 배포 후 점검이 이 값을 확인한다.
          export GIT_SHA="$(git rev-parse --short=7 HEAD)"
          # $SERVICES는 일부러 따옴표 없이 쓴다 (서비스 이름이 여러 개일 수 있다)
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build $SERVICES
          # 새 컨테이너가 뜬 뒤, 7일 넘은 도커 빌드 캐시만 지운다(디스크가 다시 차지 않게). 실패해도 배포는 성공으로 둔다.
          bash scripts/deploy/prune-build-cache.sh || true
          docker compose --env-file .env.prod -f docker-compose.prod.yml ps
          REMOTE

      # 배포 직후 사이트가 실제로 응답하는지 바깥(러너)에서 확인한다. 컨테이너가 다시 뜨는 동안은 실패할 수 있어 최대 약 2분 재시도한다.
      # 실패하면 이 작업이 빨갛게 되어 GitHub 알림으로 바로 알 수 있다. 로그인이 필요 없는 주소만 부른다(비밀값·계정을 쓰지 않는다).
      #  - 화면: 홈이 200 (프론트 컨테이너 + nginx)
      #  - API: 로그인 없이 `/users/me`를 부르면 401이 정상 (공지 등은 D43으로 공개돼 200이라 쓰지 않는다. 백엔드 컨테이너 + nginx + 보안 설정이 살아 있다는 뜻. 500/502/504면 문제)
      - name: 배포 후 점검
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://srpfreaks.com' }}
        run: |
          check() {
            url="$1"; want="$2"
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
              if [ "$code" = "$want" ]; then echo "OK   $url -> $code"; return 0; fi
              echo "WAIT $url -> $code (기대 $want, 시도 $i/12)"; sleep 10
            done
            echo "::error title=배포 후 점검 실패::$url 이(가) $want 대신 $code 를 돌려줍니다."
            return 1
          }
          check "$SITE_URL/" 200
          check "$SITE_URL/api/v1/users/me" 401
          # 헬스체크는 바깥에서 404로 막혀 있어야 한다(노출되면 안 된다)
          check "$SITE_URL/actuator/health" 404

      # 프론트를 다시 빌드했다면, 사이트가 알려 주는 빌드 커밋(/version)이 방금 배포한 브랜치의 커밋과 같은지 확인한다.
      # "워크플로는 성공인데 옛 화면"(프론트가 안 바뀐 경우)을 초록불로 지나치지 않고 실패로 드러내려는 것이다.
      # 백엔드만 배포했으면 프론트는 그대로라 건너뛴다.
      - name: 배포 버전 확인
        if: contains(inputs.target, 'frontend')
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://srpfreaks.com' }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          want=$(gh api "repos/$REPO/commits/$REF" --jq '.sha[0:7]')
          echo "기대 커밋: $want ($REF)"
          for i in $(seq 1 12); do
            got=$(curl -s --max-time 10 "$SITE_URL/version" | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "OK   $SITE_URL/version -> $got"; exit 0; fi
            echo "WAIT $SITE_URL/version -> '${got:-없음}' (기대 $want, 시도 $i/12)"; sleep 10
          done
          echo "::error title=배포 버전 불일치::사이트의 프론트 커밋이 '${got:-없음}'입니다. 기대값은 $want 입니다. Server Ops의 '상태 확인'으로 서버를 확인하세요."
          exit 1

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
