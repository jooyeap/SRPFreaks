# CI: 푸시·PR 때마다 백엔드·프론트 테스트와 빌드를 자동으로 돌린다. (배포는 별도 워크플로로 나중에 추가)
name: CI

# 푸시는 main만 돌린다. feature 브랜치는 PR을 열면 pull_request로 돈다(둘 다 돌리면 같은 검사가 두 번 실행돼 시간만 두 배가 된다)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소한다 (실행 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 저장소를 읽기만 한다. 이 워크플로는 아무것도 쓰거나 배포하지 않는다
permissions:
  contents: read

jobs:
  # 서버에서 도는 셸 스크립트(오류 요약)의 테스트. 로그에서 개인정보가 새지 않는지 확인한다
  scripts:
    name: 배포 스크립트 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 오류 요약 스크립트
        run: bash scripts/deploy/summarize-errors.test.sh
      - name: 빌드 캐시 정리 스크립트
        run: bash scripts/deploy/prune-build-cache.test.sh
      - name: 백업 점검 스크립트
        run: bash scripts/deploy/check-backups.test.sh
      - name: 배포 버전 확인 스크립트
        run: bash scripts/deploy/check-version.test.sh
      - name: 디스크 사용량 스크립트
        run: bash scripts/deploy/disk-usage.test.sh
      - name: 백업 복구 연습 스크립트
        run: bash scripts/deploy/restore-drill.test.sh
      - name: 집계 확인 스크립트
        run: bash scripts/deploy/count-stats.test.sh
      - name: 마이그레이션 상태 스크립트
        run: bash scripts/deploy/migration-status.test.sh
      - name: nginx 경로 규칙(배포 중 안내 화면)
        run: bash scripts/deploy/nginx-config.test.sh

  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Gradle 의존성·래퍼를 캐시한다
      - uses: gradle/actions/setup-gradle@v4
      - name: gradlew 실행 권한
        run: chmod +x gradlew
      # Testcontainers가 MySQL 컨테이너를 띄운다. GitHub의 ubuntu 러너에는 Docker가 기본 설치돼 있다.
      # 비밀값은 필요 없다 (테스트가 더미 값을 직접 넣는다)
      - name: 테스트
        shell: bash
        run: |
          # 출력은 화면에도 남기고 파일에도 모은다. 컴파일 오류는 테스트 결과 파일이 없어서 아래 요약 단계가 이 파일에서 찾는다
          set -o pipefail
          ./gradlew test --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      # 테스트가 실패하면 실패한 테스트의 이름과 메시지를 주석(annotation)으로 남긴다.
      # 로그 원문은 API로 읽기 어려워서, 실패 원인을 체크 결과 화면과 API에서 바로 볼 수 있게 한다.
      - name: 실패한 테스트 요약
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("build/test-results/test/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for tag in ("failure", "error"):
                      node = case.find(tag)
                      if node is not None:
                          msg = (node.get("message") or "")[:300].replace("\n", " ").replace("%", "%25")
                          print(f"::error title={case.get('classname')}.{case.get('name')}::{msg}")
          PY
          # 컴파일 오류(소스 위치가 있는 줄)만 주석으로 남긴다. 코드는 공개 저장소에 있어 파일 경로·줄·메시지가 비밀이 아니다
          grep -E '\.java:[0-9]+: error:' "$RUNNER_TEMP/gradle.log" 2>/dev/null | head -n 10 | sed -e 's/%/%25/g' -e 's#^.*/backend/##' | while IFS= read -r line; do echo "::error title=컴파일 오류::${line}"; done || true

  # 테스트를 둘로 나눠(--shard) 동시에 돌린다. 테스트 파일 수백 개가 파일마다 jsdom을 새로 만들어 느려서, 나누면 시간이 거의 반으로 준다
  frontend-test:
    name: 프론트 테스트 (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 테스트
        run: npx vitest run --shard=${{ matrix.shard }}/2

  frontend:
    name: 프론트 검사·빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Next.js 빌드 캐시: 소스가 크게 바뀌지 않으면 컴파일을 건너뛰어 빌드가 빨라진다
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      # 빌드가 되는지만 확인한다. 값은 빌드용 더미이고 결과물은 어디에도 올리지 않는다
      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-build-dummy.apps.googleusercontent.com
