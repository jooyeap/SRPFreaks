# CI: 푸시·PR 때마다 백엔드·프론트 테스트와 빌드를 자동으로 돌린다. (배포는 별도 워크플로로 나중에 추가)
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# 같은 브랜치에 새 푸시가 오면 이전 실행은 취소한다 (실행 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 저장소를 읽기만 한다. 이 워크플로는 아무것도 쓰거나 배포하지 않는다
permissions:
  contents: read

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Gradle 의존성·래퍼를 캐시한다
      - uses: gradle/actions/setup-gradle@v4
      - name: gradlew 실행 권한
        run: chmod +x gradlew
      # Testcontainers가 MySQL 컨테이너를 띄운다. GitHub의 ubuntu 러너에는 Docker가 기본 설치돼 있다.
      # 비밀값은 필요 없다 (테스트가 더미 값을 직접 넣는다)
      - name: 테스트
        run: ./gradlew test --no-daemon

  frontend:
    name: 프론트 검사·테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트
        run: npm test
      # 빌드가 되는지만 확인한다. 값은 빌드용 더미이고 결과물은 어디에도 올리지 않는다
      - name: 빌드
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-build-dummy.apps.googleusercontent.com
