# 백업 점검: 매일 한 번(그리고 Run workflow를 눌렀을 때) 서버의 DB 백업이 잘 쌓이고 있는지, 디스크 사용률이 80% 미만인지(2026-10-28) 확인한다.
# 서버에 직접 접속하기 어려워도 백업이 멈춘 것을 알 수 있게 하려는 것이다. 실패하면 이 작업이 빨갛게 되어 GitHub 알림이 온다.
#
# 서버에서 읽기만 한다(scripts/deploy/check-backups.sh). 아무것도 바꾸거나 지우지 않는다. 비밀값(SSH 키, 서버 주소)은 deploy.yml과 같은 Repository secrets만 쓴다.
# 이 저장소는 공개라 실행 로그를 누구나 읽을 수 있다. 스크립트는 개수·나이·크기 같은 숫자만 출력하고 파일 이름이나 경로는 내지 않는다.
#
# 시각: 백업은 매일 04:17 KST(19:17 UTC)에 돈다. 그 뒤인 06:00 KST(21:00 UTC)에 확인한다.
# 판정: 가장 최근 백업이 30시간보다 오래됐거나(하루를 놓침), 없거나, 너무 작거나, 압축이 깨졌으면 실패.
name: Backup Check

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# 읽기만 하는 점검이라 배포와 겹쳐도 상관없다. 점검끼리만 겹치지 않게 한다
concurrency:
  group: backup-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: 백업 점검
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: SSH 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 서버의 백업 확인
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          # 점검 스크립트는 최신 main의 것을 읽기만 한다(서버의 작업 브랜치·파일은 바꾸지 않는다).
          # 서버 쪽 종료 코드를 그대로 이 단계의 결과로 삼는다(1이면 실패).
          {
            echo "## 백업 점검 결과"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" bash -s <<'REMOTE' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          set -uo pipefail
          cd ~/gitalog
          git fetch origin main 2>&1 | tail -n 1
          bash <(git show origin/main:scripts/deploy/check-backups.sh)
          backup_status=$?
          # 디스크 사용률도 같이 본다(2026-10-28). 80% 이상이면 실패로 끝나 GitHub 알림이 온다. 숫자만 나온다.
          DISK_FAIL_AT_WARN=1 bash <(git show origin/main:scripts/deploy/disk-usage.sh)
          disk_status=$?
          [ "$backup_status" -eq 0 ] && [ "$disk_status" -eq 0 ]
          REMOTE
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
