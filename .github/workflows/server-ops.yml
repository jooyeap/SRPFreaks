# 서버 점검·복구: SSH로 직접 접속하기 어려울 때 GitHub Actions 화면(또는 모바일 앱)에서 "Run workflow"로 실행한다.
# 배포 워크플로(deploy.yml)와 같은 SSH 방식·같은 secrets를 쓴다. 결과는 실행 화면의 "Summary"에도 정리해 보여 준다.
#
# 할 수 있는 일 (action)
# - 상태 확인: 서버의 커밋, 로컬 변경, 컨테이너 상태, 이미지 생성 시각, 프론트 로그 끝부분, 디스크 사용량(숫자만, scripts/deploy/disk-usage.sh)을 보여 준다. 아무것도 바꾸지 않는다.
# - 프론트 강제 재생성: 지정한 브랜치를 받아 캐시 없이 프론트 이미지를 다시 빌드하고 컨테이너를 새로 만든다. ("배포는 성공인데 옛 화면" 복구용)
# - 최근 오류 보기: 최근 24시간 로그에서 "어디서 어떤 오류가 몇 번"인지만 집계해 보여 준다(scripts/deploy/summarize-errors.sh).
#   이 저장소는 공개라 실행 로그를 누구나 읽을 수 있으므로, 로그 원문·예외 메시지는 출력하지 않고 로거 이름·예외 종류·건수만 낸다.
# - nginx 재시작: nginx만 다시 띄운다. (재생성된 컨테이너의 새 주소를 nginx가 못 찾을 때)
# - 백업 복구 연습: 가장 최근 백업을 임시 DB(srpfreaks_drill)에 복구해 보고, 입력한 마이그레이션 파일을 그 사본에만 적용해 본다(scripts/deploy/restore-drill.sh).
#   운영 DB는 건드리지 않고, 끝나면 임시 DB를 지운다. 출력은 숫자(표 개수·행 수·오류 번호·초)뿐이다.
# - 집계 확인: 유저·기록·레이팅 기록(스냅샷) 수, 같은 티어 통계 후보 인원(티어별), 백업 파일 개수·크기를 숫자로만 보여 준다(scripts/deploy/count-stats.sh).
#   모든 질의는 읽기 전용 트랜잭션이고 아무것도 바꾸지 않는다. 이메일·닉네임·파일 이름은 내지 않는다.
#
# 지켜야 할 것 (deploy.yml과 같다)
# - DB(`db` 컨테이너·볼륨)는 건드리지 않는다. `down -v`를 쓰지 않는다.
# - 서버의 `.env.prod`는 읽거나 출력하거나 덮어쓰지 않는다. compose가 그대로 읽게만 한다.
# - 비밀값은 Repository secrets에서만 읽고 출력하지 않는다. 로그 원문은 출력하지 않는다(집계한 건수만, "최근 오류 보기").
name: Server Ops

on:
  workflow_dispatch:
    inputs:
      action:
        description: "할 일"
        required: true
        type: choice
        default: 상태 확인
        options:
          - 상태 확인
          - 최근 오류 보기
          - 프론트 강제 재생성
          - nginx 재시작
          - 백업 복구 연습
          - 집계 확인
      ref:
        description: "프론트 강제 재생성에서 받을 브랜치 (그 외에는 무시)"
        required: true
        default: main
      migrations:
        description: "백업 복구 연습에서 사본에 적용해 볼 마이그레이션 파일 이름(공백으로 구분, 적은 순서대로 적용. 예: V15__add_snapshot_levels.sql V16__add_setlist_events.sql). 비우면 복구만 확인 (그 외에는 무시)"
        required: false
        default: ""

# 배포와 겹쳐 돌면 서버에서 빌드가 엉키므로 deploy와 같은 그룹으로 한 번에 하나만 돌린다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    name: EC2 점검·복구
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 입력값 확인
        env:
          ACTION: ${{ inputs.action }}
          REF: ${{ inputs.ref }}
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "브랜치 이름에 쓸 수 없는 글자가 있습니다." >&2
            exit 1
          fi
          # 마이그레이션 이름은 글자·숫자·밑줄·점·공백만 허용한다(셸에 끼어드는 값 방지). 형식(V숫자__영문.sql)은 서버 스크립트가 한 번 더 검사한다.
          # 값 전체를 bash 정규식으로 한 번에 본다. 비어 있으면(복구만 확인·다른 작업) 통과한다.
          # (예전 grep 검사는 빈 값을 읽을 줄이 없다고 실패로 처리해서, 입력을 비운 모든 작업이 여기서 멈췄다)
          if ! [[ "$MIGRATIONS" =~ ^[A-Za-z0-9_.\ ]*$ ]]; then
            echo "마이그레이션 파일 이름에 쓸 수 없는 글자가 있습니다." >&2
            exit 1
          fi
          case "$ACTION" in
            "상태 확인")          echo "MODE=status" >> "$GITHUB_ENV" ;;
            "최근 오류 보기")     echo "MODE=recent-errors" >> "$GITHUB_ENV" ;;
            "프론트 강제 재생성") echo "MODE=recreate-frontend" >> "$GITHUB_ENV" ;;
            "nginx 재시작")       echo "MODE=restart-nginx" >> "$GITHUB_ENV" ;;
            "백업 복구 연습")     echo "MODE=restore-drill" >> "$GITHUB_ENV" ;;
            "집계 확인")          echo "MODE=counts" >> "$GITHUB_ENV" ;;
            *) echo "알 수 없는 작업입니다." >&2; exit 1 ;;
          esac

      - name: SSH 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 서버에서 실행
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          REF: ${{ inputs.ref }}
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          # 서버 명령은 표준 입력(<<'REMOTE')으로 보내고 값은 인자로만 넘긴다. 출력은 로그와 Summary에 같이 남긴다.
          {
            echo "## 서버 점검 결과 (${MODE})"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" bash -s -- "$MODE" "$REF" "$MIGRATIONS" <<'REMOTE' 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/ops-output.txt"
          set -uo pipefail
          MODE="$1"
          REF="$2"
          MIGRATIONS="$3"
          cd ~/gitalog
          DC="docker compose --env-file .env.prod -f docker-compose.prod.yml"

          show_state() {
            echo "== 서버 커밋 =="
            git log -1 --format='%h %ad %s' --date=iso
            echo "현재 브랜치: $(git branch --show-current)"
            echo "== 로컬 변경(비어 있어야 정상) =="
            git status --short
            echo "== 컨테이너 =="
            $DC ps
            echo "== 이미지 생성 시각 =="
            docker images --format '{{.Repository}}:{{.Tag}}  {{.CreatedSince}}  {{.ID}}' | head -n 10
          }

          case "$MODE" in
            status)
              git fetch origin 2>&1 | tail -n 3
              echo "== origin/main =="
              git log -1 --format='%h %ad %s' --date=iso origin/main
              show_state
              echo "== 실행 중인 프론트의 빌드 커밋 =="
              $DC exec -T frontend wget -qO- http://127.0.0.1:3000/version || echo "(가져오지 못했습니다)"
              echo
              echo "== 프론트 로그 (끝 30줄) =="
              $DC logs --tail 30 frontend
              # 디스크 사용량은 숫자만 나온다(읽기 전용). 스크립트는 최신 main의 것을 읽고 서버의 작업 파일은 바꾸지 않는다.
              bash <(git show origin/main:scripts/deploy/disk-usage.sh) || echo "(디스크 사용량을 확인하지 못했습니다)"
              ;;
            recreate-frontend)
              set -e
              git fetch origin
              git checkout "$REF"
              git pull --ff-only origin "$REF"
              export GIT_SHA="$(git rev-parse --short=7 HEAD)" # 푸터·/version에 보이는 빌드 커밋
              # --no-cache: 옛 빌드 캐시를 쓰지 않고, --force-recreate: 이미지가 같아도 컨테이너를 새로 만든다
              $DC build --no-cache frontend
              $DC up -d --force-recreate frontend
              # nginx는 시작할 때 프론트 주소를 기억하므로 같이 다시 띄운다
              $DC restart nginx
              show_state
              ;;
            recent-errors)
              # 집계 스크립트는 최신 main의 것을 읽기만 한다(서버의 작업 브랜치·파일은 바꾸지 않는다).
              # 로그 원문은 이 파이프 안에서 집계되고 밖으로 나가지 않는다. 나가는 것은 "건수 + 로거/예외 종류"뿐이다.
              git fetch origin main 2>&1 | tail -n 1
              for entry in backend:app frontend:web nginx:nginx; do
                svc="${entry%%:*}"; kind="${entry##*:}"
                echo "== ${svc} (최근 24시간) =="
                $DC logs --since 24h --no-color --no-log-prefix "$svc" 2>&1 \
                  | bash <(git show origin/main:scripts/deploy/summarize-errors.sh) "$kind"
              done
              ;;
            restart-nginx)
              $DC restart nginx
              $DC ps nginx
              ;;
            restore-drill)
              # 스크립트는 최신 main의 것을 읽는다(서버의 작업 파일은 바꾸지 않는다). 마이그레이션 이름은 위에서 글자 검사를 했고,
              # 스크립트가 형식(V숫자__영문.sql)을 다시 검사한다. $MIGRATIONS는 일부러 따옴표 없이 넘겨 공백으로 나눈다.
              git fetch origin main 2>&1 | tail -n 1
              # shellcheck disable=SC2086
              bash <(git show origin/main:scripts/deploy/restore-drill.sh) $MIGRATIONS
              ;;
            counts)
              # 숫자만 낸다(읽기 전용). 스크립트는 최신 main의 것을 읽고 서버의 작업 파일은 바꾸지 않는다.
              git fetch origin main 2>&1 | tail -n 1
              bash <(git show origin/main:scripts/deploy/count-stats.sh)
              ;;
          esac
          REMOTE
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # 집계 결과를 "검사 결과 주석"으로도 남긴다. 실행 로그 본문은 읽기 어려워서, 주석은 GitHub API로 바로 읽을 수 있다.
      - name: 오류 요약 주석 남기기
        if: always() && env.MODE == 'recent-errors'
        run: |
          if [ -s "$RUNNER_TEMP/ops-output.txt" ]; then
            msg="$(head -c 6000 "$RUNNER_TEMP/ops-output.txt")"
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
            echo "::notice title=최근 24시간 오류 요약::${msg}"
          fi

      - name: SSH 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
