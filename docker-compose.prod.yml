# 운영용 compose. 사용: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 구성: nginx(80/443, 유일하게 바깥에 열림) → frontend(3000) / backend(8080) → db(3306)
# 개발용 docker-compose.yml(DB만, 3307 포트)과는 별개 파일이다.
name: srpfreaks

x-logging: &default-logging
  # 로그 파일이 디스크를 다 채우지 않도록 크기를 제한한다 (서버 디스크가 작다)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env.prod에 넣어 주세요}   # 관리용, 앱은 쓰지 않는다
      MYSQL_DATABASE: srpfreaks
      MYSQL_USER: srpfreaks                                                                    # 앱 전용 계정
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env.prod에 넣어 주세요}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    # ports를 두지 않는다: 같은 compose 네트워크의 backend만 db:3306으로 접속할 수 있다 (인터넷에서 접근 불가)
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET(32바이트 이상)를 .env.prod에 넣어 주세요}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID를 .env.prod에 넣어 주세요}
      ROOT_EMAIL: ${ROOT_EMAIL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS를 .env.prod에 넣어 주세요}
    depends_on:
      db:
        condition: service_healthy     # DB가 준비된 뒤에 시작해야 Flyway가 실패하지 않는다
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        # 빌드 때 코드에 고정되는 값이라, 바꾸면 이미지를 다시 빌드해야 한다 (--build)
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN(예 srpfreaks.com)을 .env.prod에 넣어 주세요}
    volumes:
      # 이미지가 시작할 때 templates/*.template의 ${DOMAIN}을 채워서 conf.d/default.conf로 만든다
      # 운영은 기본값(HTTPS). 로컬 테스트는 .env.prod에 NGINX_CONF=local.conf.template
      - ./nginx/${NGINX_CONF:-default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/locations.conf:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # 6시간마다 설정을 다시 읽어서, certbot이 갱신한 인증서를 컨테이너 재시작 없이 반영한다
    command:
      - /bin/sh
      - -c
      - "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    logging: *default-logging

  # 인증서 자동 갱신(Let's Encrypt). 12시간마다 갱신이 필요한지 확인하고, 만료 30일 전부터 갱신한다.
  # 최초 발급은 서버에서 따로 한 번 실행한다 (배포 안내 참고).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    logging: *default-logging

volumes:
  db-data:
  certbot-www:
  letsencrypt:
