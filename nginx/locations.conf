# HTTPS 설정(default.conf.template)과 로컬 테스트 설정(local.conf.template)이 함께 쓰는 경로 규칙.
# 두 설정이 서로 어긋나지 않도록 한 파일로 둔다.

# 헬스체크는 서버 안(Docker)에서만 부른다. 바깥 요청은 존재하지 않는 것처럼 404로 막는다.
location /actuator/ {
    return 404;
}

# API는 백엔드로. 프록시가 보내는 클라이언트 IP로 Rate Limit이 동작하므로 X-Forwarded-For는 덧붙이지 않고
# nginx가 본 실제 주소로 덮어쓴다 (사용자가 헤더를 위조해 한도를 피하지 못하게).
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 그 밖의 모든 요청은 화면(Next.js)으로
location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
