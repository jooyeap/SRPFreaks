# HTTPS 설정(default.conf.template)과 로컬 테스트 설정(local.conf.template)이 함께 쓰는 경로 규칙.
# 두 설정이 서로 어긋나지 않도록 한 파일로 둔다.

# 헬스체크는 서버 안(Docker)에서만 부른다. 바깥 요청은 존재하지 않는 것처럼 404로 막는다.
location /actuator/ {
    return 404;
}

# API는 백엔드로. 프록시가 보내는 클라이언트 IP로 Rate Limit이 동작하므로 X-Forwarded-For는 덧붙이지 않고
# nginx가 본 실제 주소로 덮어쓴다 (사용자가 헤더를 위조해 한도를 피하지 못하게).
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 그 밖의 모든 요청은 화면(Next.js)으로
location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 프론트가 다시 뜨는 동안(배포 중) nginx가 보여 주는 빈 502 대신 짧은 안내 화면을 보인다(2026-10-28)
    error_page 502 503 504 =503 @frontend_unavailable;
}

# 배포 등으로 프론트에 잠깐 연결되지 않을 때의 안내 화면. 파일을 새로 두면 컨테이너 볼륨을 늘려야 해서 설정 안에 글자로 둔다.
# 15초 뒤 자동으로 다시 불러온다. add_header를 쓰지 않아 server의 보안 헤더(HSTS 등)를 그대로 물려받는다.
# API(/api/)는 화면이 JSON이 아닌 응답을 일반 오류 문구로 바꿔 보여 주므로 여기에 넣지 않는다.
location @frontend_unavailable {
    default_type text/html;
    charset utf-8;
    return 503 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="15"><title>SRPFreaks</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1218;color:#eef0f6;font-family:system-ui,sans-serif;text-align:center;padding:16px}p{line-height:1.6;margin:8px 0}small{color:#a0a9bc}@media (prefers-color-scheme:light){body{background:#f5f6f8;color:#14171f}small{color:#4a5263}}</style></head><body><main><h1>SRPFreaks</h1><p>사이트를 업데이트하고 있습니다. 잠시 후 다시 시도해 주세요.</p><p>サイトを更新しています。しばらくしてからもう一度お試しください。</p><small>15초 후 자동으로 다시 불러옵니다.</small></main></body></html>';
}
